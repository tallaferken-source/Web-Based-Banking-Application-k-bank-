<!-- templates/transfer.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer - K BANK</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('dashboard') }}" class="logo">
                <span>K BANK</span>
            </a>
            <div class="nav-links">
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
                <a href="{{ url_for('deposit') }}">Deposit</a>
                <a href="{{ url_for('withdraw') }}">Withdraw</a>
                <a href="{{ url_for('transfer') }}">Transfer</a>
                <a href="{{ url_for('logout') }}" class="logout">Logout</a>
            </div>
        </div>
    </nav>
    
    <div class="container" style="max-width: 600px;">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <div class="card">
            <div class="card-title">
                <span>Transfer Money</span>
            </div>
            
            <form method="POST">
                <div class="form-group">
                    <label>Recipient Username</label>
                    <input type="text" name="receiver" placeholder="Enter recipient's username" required>
                </div>
                
                <div class="form-group">
                    <label>Amount to Transfer</label>
                    <input type="number" name="amount" step="0.01" min="0.01" placeholder="Enter amount" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Send Transfer</button>
            </form>
            
            <div style="margin-top: 1rem; text-align: center;">
                <a href="{{ url_for('dashboard') }}" style="color: var(--red-primary);">← Back to Dashboard</a>
            </div>
        </div>
    </div>
</body>
</html>
